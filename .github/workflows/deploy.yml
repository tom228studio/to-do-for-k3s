name: Build and Push Docker Images

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    
    env:
      DOCKER_CONFIG: /DATA/AppData/actions-runner/.docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            docker.io/t0mst/backend:${{ github.sha }}
            docker.io/t0mst/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            docker.io/t0mst/frontend:${{ github.sha }}
            docker.io/t0mst/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max